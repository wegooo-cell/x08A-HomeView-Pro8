<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><title>时钟 · HomeView</title><link rel="stylesheet" href="clock.css?v=83"><link rel="stylesheet" href="/frame/hv/press-feedback.css?v=150"></head>
<body data-idle="off" data-wall="off" data-wallpaper-entry="off">
<header class="clock-topbar app-nav"><a class="home-link" href="/frame/hv/" aria-label="返回主屏幕"><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt=""></a><span class="app-name">时钟</span><nav class="clock-tabs" role="tablist" aria-label="时钟功能"><button role="tab" data-tab="world" id="tab-world" aria-controls="view-world">世界时钟</button><button role="tab" data-tab="alarms" id="tab-alarms" aria-controls="view-alarms">闹钟</button><button role="tab" data-tab="stopwatch" id="tab-stopwatch" aria-controls="view-stopwatch">秒表</button><button role="tab" data-tab="timers" id="tab-timers" aria-controls="view-timers">计时器<i id="timer-tab-dot" hidden></i></button></nav><a class="lockscreen-link" id="lockscreen-open" href="/frame/hv/standby/?face=numerals&amp;tone=blue"><img src="/frame/hv/app-ui/assets/ion-expand-outline.svg" alt="">锁屏</a></header>
<main class="app-content">
<div class="view-heading"><h1 id="view-title">世界时钟</h1><div class="view-tools"><button class="edit-button" id="edit-button">编辑</button><button class="add-button" id="add-button" aria-label="添加城市"><img src="/frame/hv/desktop/assets/ion-add.svg" alt=""></button></div></div>
<section class="clock-view" id="view-world" role="tabpanel" aria-labelledby="tab-world"><div class="world-map" id="world-map"><canvas id="world-map-canvas" width="1176" height="310" aria-hidden="true"></canvas><div id="world-map-labels"></div></div><div class="city-scroll"><div class="city-cards" id="city-cards"></div></div></section>
<section class="clock-view" id="view-alarms" role="tabpanel" aria-labelledby="tab-alarms" hidden><div class="alarm-list" id="alarm-list"></div><div class="empty-state" id="alarms-empty" hidden>没有闹钟</div></section>
<section class="clock-view" id="view-stopwatch" role="tabpanel" aria-labelledby="tab-stopwatch" hidden><aside class="laps-panel"><h2>分段计时</h2><div id="lap-list"></div><p class="quiet-note" id="laps-empty">开始后轻点“计次”记录分段</p></aside><div class="stopwatch-stage"><output id="stopwatch-readout" class="stopwatch-readout">00:00.00</output><div class="round-controls"><button class="round-button neutral" id="stopwatch-lap" disabled>计次</button><button class="round-button start" id="stopwatch-toggle">开始</button></div></div></section>
<section class="clock-view" id="view-timers" role="tabpanel" aria-labelledby="tab-timers" hidden><aside class="timer-sidebar"><div id="active-timers-block" hidden><h2>计时中</h2><div id="active-timers"></div></div><h2 class="recents-heading">最近使用</h2><div id="timer-recents"></div></aside><div class="timer-stage"><div id="duration-picker" class="duration-picker" role="group" aria-label="设定计时时长"><div class="picker-selection" aria-hidden="true"></div><div class="duration-wheel" role="spinbutton" aria-label="小时" aria-valuemin="0" aria-valuemax="23" tabindex="0" data-unit="hours"><div class="wheel-scroll"></div><span>小时</span></div><div class="duration-wheel" role="spinbutton" aria-label="分钟" aria-valuemin="0" aria-valuemax="59" tabindex="0" data-unit="minutes"><div class="wheel-scroll"></div><span>分钟</span></div><div class="duration-wheel" role="spinbutton" aria-label="秒" aria-valuemin="0" aria-valuemax="59" tabindex="0" data-unit="seconds"><div class="wheel-scroll"></div><span>秒</span></div></div><div class="timer-live" id="timer-live" hidden><canvas id="timer-ring" width="320" height="320" aria-hidden="true"></canvas><p id="active-timer-name"></p><output id="timer-readout">25:00</output><span id="timer-finish"></span></div><div class="round-controls timer-round-controls"><button class="round-button neutral" id="timer-cancel" disabled>取消</button><button class="round-button start" id="timer-start">开始</button></div><div class="timer-fields"><label><span>标签</span><input id="timer-label" maxlength="24" value="专注" aria-label="计时器标签"></label><label><span>计时结束时</span><select id="timer-sound" aria-label="计时结束时"><option value="bell">提示音</option><option value="none">无</option></select></label></div><p class="timer-feedback" id="timer-feedback" role="status"></p></div></section>
</main><p id="clock-status" role="status"></p>
<div class="ui-modal" id="city-modal" hidden><div class="ui-scrim" data-close-modal></div><section class="ui-sheet city-sheet" role="dialog" aria-modal="true" aria-labelledby="city-title"><header><button class="text-button" data-close-modal>取消</button><h2 id="city-title">添加城市</h2><span></span></header><input class="city-search" id="city-search" type="search" placeholder="搜索城市" aria-label="搜索城市" data-first-focus><div class="city-results" id="city-results"></div></section></div>
<div class="ui-modal" id="alarm-modal" hidden><div class="ui-scrim" data-close-modal></div><form class="ui-sheet alarm-sheet" id="alarm-form" role="dialog" aria-modal="true" aria-labelledby="alarm-title">
<div id="alarm-editor-main"><header><button class="text-button" type="button" data-close-modal>取消</button><h2 id="alarm-title">添加闹钟</h2><button class="text-button" type="submit">保存</button></header>
<input type="hidden" id="alarm-time" value="07:00"><div class="alarm-time-picker" role="group" aria-label="闹钟时间"><div class="alarm-wheel-selection" aria-hidden="true"></div><div class="alarm-time-wheel" id="alarm-hour-wheel" role="spinbutton" aria-label="小时" aria-valuemin="0" aria-valuemax="23" tabindex="0" data-first-focus><div class="alarm-wheel-scroll"></div></div><span class="alarm-time-colon" aria-hidden="true">:</span><div class="alarm-time-wheel" id="alarm-minute-wheel" role="spinbutton" aria-label="分钟" aria-valuemin="0" aria-valuemax="59" tabindex="0"><div class="alarm-wheel-scroll"></div></div></div>
<div class="alarm-fields"><div class="alarm-setting-row"><span>重复</span><input type="hidden" id="alarm-repeat" value="once"><button type="button" id="alarm-repeat-open" aria-label="设置重复"><span id="alarm-repeat-name">不重复</span><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt=""></button></div><label><span>标签</span><input id="alarm-label" value="闹钟" maxlength="24" aria-label="闹钟标签"></label><label><span>稍后提醒</span><input class="switch-input" id="alarm-snooze" type="checkbox" checked aria-label="稍后提醒"></label></div><button id="alarm-delete" type="button" class="delete-alarm" hidden>删除闹钟</button></div>
<section id="alarm-repeat-panel" aria-label="重复方式" hidden><header><button class="text-button" type="button" id="alarm-repeat-back">返回</button><h2>重复</h2><span class="text-button"></span></header><div class="alarm-repeat-list"><button type="button" data-alarm-repeat="once">不重复<img src="/frame/hv/desktop/assets/ion-checkmark.svg" alt="已选"></button><button type="button" data-alarm-repeat="weekdays">工作日<img src="/frame/hv/desktop/assets/ion-checkmark.svg" alt="已选"></button><button type="button" data-alarm-repeat="weekend">周末<img src="/frame/hv/desktop/assets/ion-checkmark.svg" alt="已选"></button><button type="button" data-alarm-repeat="everyday">每天<img src="/frame/hv/desktop/assets/ion-checkmark.svg" alt="已选"></button></div></section>
</form></div>
<div class="ui-modal" id="ring-modal" hidden><section class="ui-sheet ring-sheet" role="dialog" aria-modal="true" aria-labelledby="ring-label"><h2 id="ring-label">闹钟</h2><p id="ring-time"></p><button id="ring-snooze" class="text-button">稍后提醒 · 9分钟</button><button id="ring-dismiss" class="text-button" data-first-focus>停止</button></section></div>
<script src="/frame/hv/config.js"></script><script src="/frame/shared/cond.js"></script><script src="/frame/hv/hv.js?v=163"></script><script src="/frame/hv/app-ui/app-ui.js?v=1"></script><script src="assets/d3-array.min.js"></script><script src="assets/d3-geo.min.js"></script><script src="clock.js?v=150"></script><script src="/frame/hv/press-feedback.js?v=150"></script></body></html>
