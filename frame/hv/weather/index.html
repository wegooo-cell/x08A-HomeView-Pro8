<!doctype html>
<html data-wallpaper-pending="true" lang="zh-CN"><head><style id="wallpaper-first-paint">html{background:#000}html[data-wallpaper-pending] body.follow-wallpaper[data-wall],html[data-wallpaper-pending] .app-wall,html[data-wallpaper-pending] .desktop-wall{background-color:#000!important;background-image:none!important}html[data-wallpaper-pending] .app-wall:after,html[data-wallpaper-pending] body:before{opacity:0!important}html[data-wallpaper-pending] .weather-background{background:#000!important}html[data-wallpaper-pending] .photos-heading{color:#fff}</style><meta charset="utf-8"><meta name="viewport" content="width=1280,initial-scale=1"><link rel="stylesheet" href="/frame/hv/hv.css?v=63-ease"><title>天气 · HomeView</title>
<link rel="stylesheet" href="weather.css?v=168"><link rel="stylesheet" href="/frame/hv/home/glass.css?v=162"><link rel="stylesheet" href="/frame/hv/settings/weather-city.css?v=89-layout"><link rel="stylesheet" href="/frame/hv/press-feedback.css?v=150"></head>
<body class="weather-page follow-wallpaper">
<div class="weather-background" aria-hidden="true"></div>
<header class="weather-nav"><a href="/frame/hv/" class="home-link"><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt="">首页</a><button id="weather-refresh" type="button" aria-label="刷新天气">刷新</button><a class="weather-city-link" href="/frame/hv/settings/?weather-city=1">城市</a><div class="weather-date"><span id="weather-date"></span><time id="weather-clock"></time></div></header>
<main class="weather-layout" id="weather-main">
<section class="current-weather" aria-label="当前天气"><h1>天气</h1><p class="current-condition"><img src="/frame/hv/desktop/assets/ion-partly-sunny.svg" alt="">正在读取天气</p><div class="current-temp" aria-label="当前温度暂无数据">--°</div><p class="current-range">最高 --°<span>最低 --°</span></p><p class="current-summary">正在读取天气</p></section>
<section class="weather-card hourly-card" aria-labelledby="hourly-title"><header class="card-header"><h2 id="hourly-title">逐小时预报</h2><div class="hourly-tools"><span>未来 24 小时</span><button id="hours-prev" aria-label="查看更早的小时预报"><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt=""></button><button id="hours-next" aria-label="查看更晚的小时预报"><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt=""></button></div></header><div class="hourly-strip" id="hourly-strip" aria-label="24小时天气预报"></div></section>
<section class="weather-card week-card" aria-labelledby="week-title"><header class="card-header"><h2 id="week-title">未来七天</h2><span class="card-note">轻点查看详情</span></header><div id="week-rows"></div></section>
<div class="metric-grid" aria-label="当前天气指标">
<section class="weather-card metric-card"><h2><img src="/frame/hv/desktop/assets/ion-thermometer-outline.svg" alt="">体感温度</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card metric-card"><h2><img src="/frame/hv/desktop/assets/weather-droplet-half.svg" alt="">湿度</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card metric-card"><h2><img src="/frame/hv/desktop/assets/weather-wind.svg" alt="">风速</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card metric-card"><h2><img src="/frame/hv/desktop/assets/ion-sunny.svg" alt="">紫外线指数</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card metric-card"><h2><img src="assets/ion-rainy.svg" alt="">降水概率</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card metric-card"><h2><img src="assets/ion-eye-outline.svg" alt="">能见度</h2><p class="metric-value">--</p><p class="metric-note">暂无数据</p></section>
</div>
<section class="weather-card air-card"><h2><img src="/frame/hv/desktop/assets/weather-grid-3x3-gap.svg" alt="">空气质量</h2><p class="air-value">--</p><p class="metric-note">暂无数据</p></section>
<section class="weather-card sun-card"><h2><img src="/frame/hv/desktop/assets/weather-sunset.svg" alt="">日落</h2><div class="sun-times"><p>--</p><span>日出 --</span></div><p class="metric-note">暂无数据</p></section>
</main>
<footer class="weather-source" id="weather-source">正在读取天气</footer>
<div class="day-dialog" id="day-dialog" hidden><div class="day-scrim"></div><section class="day-sheet" role="dialog" aria-modal="true" aria-labelledby="day-title"><header><div><p>天气</p><h2 id="day-title"></h2></div><button id="day-close" aria-label="关闭每日天气详情"><img src="/frame/hv/desktop/assets/ion-close.svg" alt=""></button></header><div id="day-content"></div><footer><button id="day-prev" aria-label="查看前一天"><img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt="">前一天</button><span id="day-position"></span><button id="day-next" aria-label="查看后一天">后一天<img src="/frame/hv/desktop/assets/ion-chevron-up.svg" alt=""></button></footer></section></div>
<script src="/frame/hv/config.js"></script><script src="/frame/shared/cond.js"></script><script src="/frame/hv/hv.js?v=163"></script><script src="/frame/hv/home/wallpaper.js?v=164"></script><script src="/frame/hv/app-ui/app-ui.js?v=2"></script><script src="/frame/hv/app-ui/weather-data.js?v=177"></script><script src="weather.js?v=177"></script><script src="/frame/hv/press-feedback.js?v=150"></script></body></html>
