name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: HomeView-Windows-x64
          - os: macos-15
            artifact: HomeView-macOS-arm64
          - os: macos-15-intel
            artifact: HomeView-macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test deployment engine
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install -r requirements-installer.txt
      - name: Build and smoke test executable
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.sha256
            dist/desktop-self-test.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --dir downloaded
      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" downloaded/*/*.zip downloaded/*/*.sha256 --clobber
